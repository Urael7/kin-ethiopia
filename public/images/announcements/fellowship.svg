  <text x="400" y="260" font-family="Georgia, serif" font-size="72" fill="#C4A35A" text-anchor="middle" font-weight="bold" opacity="0.95">ማ</text>
  
  <rect x="150" y="420" width="500" height="110" rx="16" fill="rgba(28, 22, 18, 0.75)" stroke="rgba(196, 163, 90, 0.4)" stroke-width="1" />
